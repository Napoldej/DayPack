<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1400"/>
<title>DayPack — iOS Hi-Fi Design</title>
<style>
  html, body { margin: 0; padding: 0; background: #EFEAE3; font-family: -apple-system, "SF Pro Text", system-ui, sans-serif; color: #1B1B1F; }
  #root { min-height: 100vh; }
  /* Hide scrollbars inside phone artboards while still allowing scroll */
  .dp-card *::-webkit-scrollbar { display: none; }
  .dp-card * { scrollbar-width: none; }
  .dp-row { display: flex; flex-wrap: wrap; gap: 36px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="env,react">
/* ────────────────────────────────────────────────────────────
 * DayPack — single-file implementation
 * Recreates the design exported from claude.ai/design.
 * Tokens + primitives + 18 hi-fi screens in one HTML file.
 * ──────────────────────────────────────────────────────────── */

// ── Design tokens ─────────────────────────────────────────────
const DP = {
  orange: '#FF6B2C',
  orangeDeep: '#E8531A',
  orangeSoft: '#FFE9DC',
  orangeMuted: '#FFF4ED',
  green: '#2FBF71',
  greenSoft: '#E5F7EC',
  red: '#E5484D',
  redSoft: '#FFEBEC',
  amber: '#F5A524',
  amberSoft: '#FFF3DC',
  bg: '#F7F5F2',
  bgGrouped: '#F2EFEA',
  surface: '#FFFFFF',
  surfaceAlt: '#FAF8F5',
  hairline: 'rgba(60,60,67,0.10)',
  divider: 'rgba(60,60,67,0.06)',
  ink: '#1B1B1F',
  ink2: '#3C3C43',
  ink3: 'rgba(60,60,67,0.6)',
  ink4: 'rgba(60,60,67,0.36)',
  rSm: 10, rMd: 14, rLg: 18, rXl: 22, rXxl: 28,
  shadowSoft: '0 1px 2px rgba(20,20,30,0.04), 0 8px 24px rgba(20,20,30,0.05)',
  shadowCard: '0 1px 2px rgba(20,20,30,0.05), 0 12px 32px rgba(20,20,30,0.07)',
  shadowPop:  '0 6px 12px rgba(20,20,30,0.08), 0 24px 56px rgba(20,20,30,0.14)',
  font: '-apple-system, "SF Pro Text", "SF Pro Display", system-ui, sans-serif',
  fontRound: '"SF Pro Rounded", -apple-system, system-ui, sans-serif',
};

// ── Icon set (line-style stroke = currentColor) ───────────────
const Icon = ({ name, size = 22, stroke = 1.8, color = 'currentColor' }) => {
  const s = { width: size, height: size, display: 'block' };
  const common = { fill: 'none', stroke: color, strokeWidth: stroke, strokeLinecap: 'round', strokeLinejoin: 'round' };
  switch (name) {
    case 'backpack':   return <svg viewBox="0 0 24 24" style={s}><path d="M7 9V7a5 5 0 0110 0v2" {...common}/><rect x="4.5" y="9" width="15" height="12" rx="3.5" {...common}/><path d="M9 13h6M9 17h6" {...common}/><path d="M10 9.5h4" {...common}/></svg>;
    case 'check':      return <svg viewBox="0 0 24 24" style={s}><path d="M5 12.5l4.5 4.5L19 7.5" {...common}/></svg>;
    case 'plus':       return <svg viewBox="0 0 24 24" style={s}><path d="M12 5v14M5 12h14" {...common}/></svg>;
    case 'chevR':      return <svg viewBox="0 0 24 24" style={s}><path d="M9 6l6 6-6 6" {...common}/></svg>;
    case 'chevL':      return <svg viewBox="0 0 24 24" style={s}><path d="M15 6l-6 6 6 6" {...common}/></svg>;
    case 'chevD':      return <svg viewBox="0 0 24 24" style={s}><path d="M6 9l6 6 6-6" {...common}/></svg>;
    case 'close':      return <svg viewBox="0 0 24 24" style={s}><path d="M6 6l12 12M18 6L6 18" {...common}/></svg>;
    case 'bell':       return <svg viewBox="0 0 24 24" style={s}><path d="M6 16V11a6 6 0 0112 0v5l1.5 2h-15L6 16z" {...common}/><path d="M10 20a2 2 0 004 0" {...common}/></svg>;
    case 'pin':        return <svg viewBox="0 0 24 24" style={s}><path d="M12 21s7-6.5 7-12a7 7 0 10-14 0c0 5.5 7 12 7 12z" {...common}/><circle cx="12" cy="9" r="2.5" {...common}/></svg>;
    case 'search':     return <svg viewBox="0 0 24 24" style={s}><circle cx="11" cy="11" r="6.5" {...common}/><path d="M16 16l4.5 4.5" {...common}/></svg>;
    case 'gear':       return <svg viewBox="0 0 24 24" style={s}><circle cx="12" cy="12" r="3" {...common}/><path d="M19.4 15a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1.04 1.56V21a2 2 0 01-4 0v-.08a1.7 1.7 0 00-1.04-1.56 1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.7 1.7 0 00.34-1.87 1.7 1.7 0 00-1.56-1.04H3a2 2 0 010-4h.08A1.7 1.7 0 004.64 9 1.7 1.7 0 004.3 7.13l-.06-.06a2 2 0 112.83-2.83l.06.06A1.7 1.7 0 009 4.64 1.7 1.7 0 0010.04 3.08V3a2 2 0 014 0v.08a1.7 1.7 0 001.04 1.56 1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06a1.7 1.7 0 00-.34 1.87V9a1.7 1.7 0 001.56 1.04H21a2 2 0 010 4h-.08a1.7 1.7 0 00-1.56 1.04z" {...common}/></svg>;
    case 'flame':      return <svg viewBox="0 0 24 24" style={s}><path d="M12 3s4 4 4 8a4 4 0 11-8 0c0-1.5.5-2.5 1.5-3.5C10 9 9 7 12 3z" {...common}/><path d="M9 14a3 3 0 006 0" {...common}/></svg>;
    case 'dumbbell':   return <svg viewBox="0 0 24 24" style={s}><rect x="2" y="9" width="3" height="6" rx="1" {...common}/><rect x="19" y="9" width="3" height="6" rx="1" {...common}/><rect x="5" y="10.5" width="2" height="3" rx="0.5" {...common}/><rect x="17" y="10.5" width="2" height="3" rx="0.5" {...common}/><path d="M7 12h10" {...common}/></svg>;
    case 'book':       return <svg viewBox="0 0 24 24" style={s}><path d="M4 5a2 2 0 012-2h6v18H6a2 2 0 01-2-2V5zM20 5a2 2 0 00-2-2h-6v18h6a2 2 0 002-2V5z" {...common}/></svg>;
    case 'plane':      return <svg viewBox="0 0 24 24" style={s}><path d="M3 12l18-7-7 18-2-7-9-4z" {...common}/></svg>;
    case 'briefcase':  return <svg viewBox="0 0 24 24" style={s}><rect x="3" y="7" width="18" height="13" rx="2" {...common}/><path d="M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2" {...common}/><path d="M3 13h18" {...common}/></svg>;
    case 'home':       return <svg viewBox="0 0 24 24" style={s}><path d="M3 11l9-7 9 7v9a2 2 0 01-2 2h-4v-7H9v7H5a2 2 0 01-2-2v-9z" {...common}/></svg>;
    case 'list':       return <svg viewBox="0 0 24 24" style={s}><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01" {...common}/></svg>;
    case 'sun':        return <svg viewBox="0 0 24 24" style={s}><circle cx="12" cy="12" r="4" {...common}/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4" {...common}/></svg>;
    case 'moon':       return <svg viewBox="0 0 24 24" style={s}><path d="M20 14.5A8 8 0 119.5 4a7 7 0 0010.5 10.5z" {...common}/></svg>;
    case 'water':      return <svg viewBox="0 0 24 24" style={s}><path d="M12 3s6 7 6 12a6 6 0 11-12 0c0-5 6-12 6-12z" {...common}/></svg>;
    case 'shoe':       return <svg viewBox="0 0 24 24" style={s}><path d="M3 16c0-2 1-4 3-5l3-2 3 3 4 1c2 0 4 1 5 3v2H3v-2z" {...common}/><path d="M9 9l1-3" {...common}/></svg>;
    case 'headphones': return <svg viewBox="0 0 24 24" style={s}><path d="M4 14a8 8 0 0116 0v4a2 2 0 01-2 2h-1v-6h3M4 14v4a2 2 0 002 2h1v-6H4" {...common}/></svg>;
    case 'laptop':     return <svg viewBox="0 0 24 24" style={s}><rect x="4" y="5" width="16" height="11" rx="2" {...common}/><path d="M2 19h20" {...common}/></svg>;
    case 'key':        return <svg viewBox="0 0 24 24" style={s}><circle cx="8" cy="14" r="3.5" {...common}/><path d="M11 13l9-9M16 8l3 3M14 10l3 3" {...common}/></svg>;
    case 'wallet':     return <svg viewBox="0 0 24 24" style={s}><rect x="3" y="6" width="18" height="13" rx="2.5" {...common}/><path d="M16 13h2" {...common}/><path d="M3 9h14a4 4 0 014 4" {...common}/></svg>;
    case 'umbrella':   return <svg viewBox="0 0 24 24" style={s}><path d="M3 12a9 9 0 0118 0H3z" {...common}/><path d="M12 12v7a2 2 0 002 2" {...common}/></svg>;
    case 'toothbrush': return <svg viewBox="0 0 24 24" style={s}><path d="M5 19l8-8M11 13l3 3M14 10l4-4a2.8 2.8 0 014 4l-4 4" {...common}/></svg>;
    case 'edit':       return <svg viewBox="0 0 24 24" style={s}><path d="M4 20l4-1L20 7l-3-3L5 16l-1 4z" {...common}/></svg>;
    case 'trash':      return <svg viewBox="0 0 24 24" style={s}><path d="M4 7h16M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2M6 7l1 13a2 2 0 002 2h6a2 2 0 002-2l1-13" {...common}/></svg>;
    case 'sparkle':    return <svg viewBox="0 0 24 24" style={s}><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3zM18 16l.8 2.2L21 19l-2.2.8L18 22l-.8-2.2L15 19l2.2-.8L18 16z" {...common}/></svg>;
    case 'calendar':   return <svg viewBox="0 0 24 24" style={s}><rect x="3.5" y="5" width="17" height="16" rx="2.5" {...common}/><path d="M3.5 10h17M8 3v4M16 3v4" {...common}/></svg>;
    case 'clock':      return <svg viewBox="0 0 24 24" style={s}><circle cx="12" cy="12" r="8.5" {...common}/><path d="M12 7.5V12l3 2" {...common}/></svg>;
    case 'arrow':      return <svg viewBox="0 0 24 24" style={s}><path d="M5 12h14M13 6l6 6-6 6" {...common}/></svg>;
    default: return null;
  }
};

// ── Shared primitives ────────────────────────────────────────
const Switch = ({ on = true, color }) => {
  const c = color || DP.orange;
  return (
    <div style={{ width: 51, height: 31, borderRadius: 100, background: on ? c : '#E5E5EA', position: 'relative', flexShrink: 0 }}>
      <div style={{ position: 'absolute', top: 2, left: on ? 22 : 2, width: 27, height: 27, borderRadius: 100, background: '#fff', boxShadow: '0 3px 8px rgba(0,0,0,0.15), 0 1px 1px rgba(0,0,0,0.06)' }}/>
    </div>
  );
};

const Check = ({ checked = false, size = 26, color = DP.green }) => {
  if (!checked) return <div style={{ width: size, height: size, borderRadius: 100, border: `1.6px solid ${DP.ink4}`, flexShrink: 0 }}/>;
  return (
    <div style={{ width: size, height: size, borderRadius: 100, background: color, flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: `0 2px 6px ${color}55` }}>
      <svg width={size*0.55} height={size*0.55} viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3.2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M5 12.5l4.5 4.5L19 7.5"/>
      </svg>
    </div>
  );
};

const PrimaryButton = ({ children, full = true, style, color }) => (
  <div style={{
    background: color || DP.orange, color: '#fff', height: 54, borderRadius: 16,
    display: 'flex', alignItems: 'center', justifyContent: 'center',
    fontFamily: DP.font, fontSize: 17, fontWeight: 600, letterSpacing: -0.2,
    boxShadow: '0 6px 16px rgba(255,107,44,0.30)',
    width: full ? '100%' : undefined, padding: full ? 0 : '0 22px',
    ...style,
  }}>{children}</div>
);

const SecondaryButton = ({ children, style }) => (
  <div style={{
    background: DP.orangeSoft, color: DP.orangeDeep, height: 54, borderRadius: 16,
    display: 'flex', alignItems: 'center', justifyContent: 'center',
    fontFamily: DP.font, fontSize: 17, fontWeight: 600, letterSpacing: -0.2, width: '100%',
    ...style,
  }}>{children}</div>
);

const TextButton = ({ children, color = DP.orange, style }) => (
  <div style={{ color, fontFamily: DP.font, fontSize: 17, fontWeight: 600, padding: '14px 0', textAlign: 'center', ...style }}>{children}</div>
);

const StatusBar = ({ dark = false, time = '9:41' }) => {
  const c = dark ? '#fff' : DP.ink;
  return (
    <div style={{
      height: 54, position: 'relative', zIndex: 5,
      display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between',
      padding: '0 32px 12px', fontFamily: DP.font, color: c, pointerEvents: 'none',
    }}>
      <div style={{ fontSize: 17, fontWeight: 600, letterSpacing: -0.2, width: 110 }}>{time}</div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 7 }}>
        <svg width="18" height="11" viewBox="0 0 18 11"><g fill={c}>
          <rect x="0" y="7" width="3" height="4" rx="0.7"/>
          <rect x="5" y="5" width="3" height="6" rx="0.7"/>
          <rect x="10" y="2.5" width="3" height="8.5" rx="0.7"/>
          <rect x="15" y="0" width="3" height="11" rx="0.7"/>
        </g></svg>
        <svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 2c2.6 0 5 1 6.8 2.7M8.5 5.2c1.7 0 3.3.7 4.5 1.8M8.5 8.4c.8 0 1.5.3 2 .9M8.5 11l.5-.5L8.5 11z" stroke={c} strokeWidth="1.2" fill={c}/></svg>
        <svg width="27" height="12" viewBox="0 0 27 12">
          <rect x="0.5" y="0.5" width="22" height="11" rx="3" fill="none" stroke={c} opacity="0.5"/>
          <rect x="2" y="2" width="19" height="8" rx="1.5" fill={c}/>
          <rect x="23.5" y="4" width="2" height="4" rx="0.6" fill={c} opacity="0.5"/>
        </svg>
      </div>
    </div>
  );
};

const SectionLabel = ({ children, style }) => (
  <div style={{ fontFamily: DP.font, fontSize: 13, fontWeight: 600, color: DP.ink3, letterSpacing: 0.4, textTransform: 'uppercase', marginBottom: 10, ...style }}>{children}</div>
);

const Card = ({ children, style, padding = 0 }) => (
  <div style={{ background: DP.surface, borderRadius: DP.rXl, boxShadow: DP.shadowSoft, padding, ...style }}>{children}</div>
);

const TabBar = ({ active = 'today' }) => {
  const item = (key, icon, label) => {
    const on = active === key;
    return (
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3, color: on ? DP.orange : DP.ink4 }}>
        <Icon name={icon} size={26} stroke={on ? 2.2 : 1.7}/>
        <div style={{ fontFamily: DP.font, fontSize: 10, fontWeight: 600, letterSpacing: 0.1 }}>{label}</div>
      </div>
    );
  };
  return (
    <div style={{
      position: 'absolute', bottom: 0, left: 0, right: 0,
      paddingBottom: 30, paddingTop: 10,
      background: 'rgba(255,255,255,0.92)',
      backdropFilter: 'blur(20px) saturate(180%)',
      WebkitBackdropFilter: 'blur(20px) saturate(180%)',
      borderTop: `0.5px solid ${DP.hairline}`,
      display: 'flex', zIndex: 20,
    }}>
      {item('today', 'sun', 'Today')}
      {item('loadouts', 'backpack', 'Loadouts')}
      {item('stats', 'flame', 'Stats')}
      {item('settings', 'gear', 'Settings')}
    </div>
  );
};

const Monogram = ({ size = 56, radius = 16 }) => (
  <div style={{
    width: size, height: size, borderRadius: radius, background: DP.orange, color: '#fff',
    display: 'flex', alignItems: 'center', justifyContent: 'center',
    fontFamily: DP.fontRound, fontWeight: 800, fontSize: size * 0.42,
    letterSpacing: -1, boxShadow: '0 8px 20px rgba(255,107,44,0.35)',
  }}>DP</div>
);

const LoadoutIcon = ({ name, color = DP.orange, bg, size = 44, r = 12 }) => (
  <div style={{
    width: size, height: size, borderRadius: r,
    background: bg || (color === DP.orange ? DP.orangeSoft : `${color}1A`),
    color, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0,
  }}>
    <Icon name={name} size={size * 0.5} stroke={1.9}/>
  </div>
);

const ProgressBar = ({ value = 0, height = 8, color = DP.orange, bg = '#F0EAE2' }) => (
  <div style={{ height, background: bg, borderRadius: 100, overflow: 'hidden', position: 'relative' }}>
    <div style={{
      position: 'absolute', top: 0, left: 0, bottom: 0,
      width: `${Math.max(0, Math.min(100, value))}%`,
      background: `linear-gradient(90deg, ${color}, ${DP.orangeDeep})`,
      borderRadius: 100,
    }}/>
  </div>
);

const Pill = ({ children, color = DP.ink3, bg = '#F0EAE2', style }) => (
  <span style={{
    display: 'inline-flex', alignItems: 'center', gap: 4, height: 22, padding: '0 9px', borderRadius: 100,
    background: bg, color, fontFamily: DP.font, fontSize: 11.5, fontWeight: 600, letterSpacing: 0.1,
    ...style,
  }}>{children}</span>
);

// ── iPhone shell ─────────────────────────────────────────────
const PHONE_W = 390, PHONE_H = 844;
const Phone = ({ children, dark = false, bg, style }) => (
  <div style={{
    width: PHONE_W, height: PHONE_H, borderRadius: 54, overflow: 'hidden', position: 'relative',
    background: dark ? '#000' : (bg || DP.bg),
    boxShadow: '0 0 0 12px #1c1c1e, 0 0 0 13px #2a2a2e, 0 30px 60px rgba(0,0,0,0.18)',
    fontFamily: DP.font, color: DP.ink, WebkitFontSmoothing: 'antialiased',
    ...style,
  }}>
    <div style={{ position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)', width: 124, height: 36, borderRadius: 24, background: '#000', zIndex: 100 }}/>
    <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 50 }}><StatusBar dark={dark}/></div>
    <div style={{
      position: 'absolute', bottom: 8, left: '50%', transform: 'translateX(-50%)',
      width: 134, height: 5, borderRadius: 100,
      background: dark ? 'rgba(255,255,255,0.65)' : 'rgba(0,0,0,0.28)', zIndex: 99,
    }}/>
    {children}
  </div>
);

/* ────────────── SCREENS ────────────── */

// 1·1 Onboarding — Welcome
const OB_Welcome = () => (
  <Phone>
    <div style={{ paddingTop: 54, height: '100%', display: 'flex', flexDirection: 'column', padding: '54px 28px 30px' }}>
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 28 }}>
        <div style={{ position: 'relative' }}>
          <div style={{ position: 'absolute', inset: -30, borderRadius: 200, background: 'radial-gradient(circle, rgba(255,107,44,0.18), rgba(255,107,44,0) 70%)' }}/>
          <div style={{
            width: 120, height: 120, borderRadius: 32, background: '#fff',
            display: 'flex', alignItems: 'center', justifyContent: 'center', position: 'relative',
            boxShadow: '0 16px 40px rgba(255,107,44,0.20)', border: `1.5px solid ${DP.orangeSoft}`,
          }}>
            <div style={{ color: DP.orange }}><Icon name="backpack" size={64} stroke={1.6}/></div>
          </div>
        </div>
        <div style={{ textAlign: 'center' }}>
          <div style={{ fontFamily: DP.fontRound, fontSize: 36, fontWeight: 800, letterSpacing: -1, color: DP.ink, lineHeight: 1.05 }}>
            Never Forget<br/>Again
          </div>
          <div style={{ fontSize: 16, color: DP.ink3, marginTop: 12, lineHeight: 1.45, padding: '0 20px' }}>
            Your smart daily-loadout companion. Pack with confidence, leave with peace of mind.
          </div>
        </div>
      </div>
      <div>
        <PrimaryButton>Get Started</PrimaryButton>
        <TextButton color={DP.ink3}>I already have an account</TextButton>
      </div>
    </div>
  </Phone>
);

// 1·2 Onboarding — Set Home Location
const OB_Location = () => (
  <Phone>
    <div style={{ paddingTop: 54, height: '100%', display: 'flex', flexDirection: 'column' }}>
      <div style={{ padding: '12px 22px 8px', display: 'flex', alignItems: 'center', gap: 14 }}>
        <div style={{ color: DP.ink2 }}><Icon name="chevL" size={22}/></div>
        <div style={{ flex: 1, display: 'flex', gap: 4 }}>
          {[0,1,2,3,4].map(i => (
            <div key={i} style={{ flex: 1, height: 4, borderRadius: 100, background: i <= 1 ? DP.orange : DP.bgGrouped }}/>
          ))}
        </div>
        <div style={{ fontSize: 14, fontWeight: 600, color: DP.ink3 }}>Skip</div>
      </div>
      <div style={{ padding: '14px 28px 10px' }}>
        <div style={{ fontFamily: DP.fontRound, fontSize: 28, fontWeight: 700, letterSpacing: -0.6 }}>Set Your Home</div>
        <div style={{ fontSize: 15, color: DP.ink3, marginTop: 6, lineHeight: 1.4 }}>
          We'll quietly check that you're packed only when you're about to leave home.
        </div>
      </div>
      <div style={{ padding: '14px 22px 0' }}>
        <div style={{ background: '#fff', borderRadius: 14, padding: '13px 14px', display: 'flex', alignItems: 'center', gap: 10, color: DP.ink3, boxShadow: DP.shadowSoft, fontSize: 15 }}>
          <Icon name="search" size={18} color={DP.ink3}/><span>Search address</span>
        </div>
      </div>
      <div style={{ flex: 1, padding: '16px 22px 0', position: 'relative' }}>
